[package]
name = "arysen-storage"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
arysen-wallet = { path = "../wallet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
cid = { version = "0.11", default-features = false, features = ["alloc"] }
multihash-codetable = { version = "0.1", default-features = false, features = ["sha2"] }
