[package]
name = "arysen-mandate"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
arysen-wallet = { path = "../wallet" }
aes-gcm = "0.10"
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
hex = "0.4"
